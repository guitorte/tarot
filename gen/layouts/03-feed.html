<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0d0b">
<title>03 · Feed de frases</title>
<link rel="stylesheet" href="data/base.css">
<style>
  :root{--paper:#0f0d0b;--ink:#f6f0e6;--ink-2:#ded4c4;--muted:#9a8f7e;--gold:#e8b45c}
  .kw{color:#fff;box-shadow:inset 0 -.5em 0 rgba(232,180,92,.28)}
  html,body{height:100%;background:#0f0d0b}
  body{overflow:hidden}
  .feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;
        -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .feed::-webkit-scrollbar{display:none}
  .screen{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;
    display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}

  /* fundo: as duas cartas, desfocadas e escuras */
  .bg{position:absolute;inset:0;display:flex}
  .bg img{width:50%;height:100%;object-fit:cover;filter:blur(9px) saturate(.75) brightness(.42);
    transform:scale(1.12)}
  .veil{position:absolute;inset:0;
    background:radial-gradient(120% 70% at 50% 30%,rgba(15,13,11,.25),rgba(15,13,11,.92) 78%)}

  .body{position:relative;padding:0 24px calc(120px + var(--safe-b));z-index:2}
  .lens-tag{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.15em;
    text-transform:uppercase;color:#12100c;background:var(--ac,#e8b45c);
    padding:5px 11px;border-radius:999px;font-weight:700;margin-bottom:16px}
  .phrase{font-family:var(--serif);font-size:clamp(26px,7.6vw,34px);line-height:1.28;
    color:var(--ink);margin:0 0 16px;font-weight:500}
  .from{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .from img{width:26px;height:42px;object-fit:cover;border-radius:4px}

  /* capa */
  .cover{align-items:center;justify-content:center;text-align:center}
  .cover .pair{display:flex;gap:12px;justify-content:center;margin-bottom:22px;position:relative;z-index:2}
  .cover .pair button{width:31vw;max-width:150px;aspect-ratio:11/18;border-radius:12px;overflow:hidden;
    background:#1c1813;box-shadow:0 12px 30px rgba(0,0,0,.6);position:relative}
  .cover .pair img{width:100%;height:100%;object-fit:cover}
  .cover .pair .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:12px;border:1px dashed rgba(246,240,230,.2);border-radius:12px;padding:10px}
  .cover h1{font-family:var(--serif);font-size:27px;margin:0 0 6px;font-weight:600;position:relative;z-index:2}
  .cover p{color:var(--muted);font-size:14.5px;margin:0 0 26px;position:relative;z-index:2;padding:0 20px}
  .cover .go{position:relative;z-index:2;display:flex;gap:10px;padding:0 20px}
  .cover .go button{min-height:52px;padding:0 20px;border-radius:14px;background:var(--gold);
    color:#171208;font-weight:650;font-size:15px}
  .cover .go .ghost{background:rgba(246,240,230,.1);color:var(--ink)}
  .swipe{position:absolute;bottom:calc(26px + var(--safe-b));left:0;right:0;text-align:center;
    color:var(--muted);font-size:12.5px;z-index:2;animation:bob 1.8s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0);opacity:.65}50%{transform:translateY(-6px);opacity:1}}

  /* ações fixas, na altura do polegar */
  .acts{position:fixed;right:12px;bottom:calc(96px + var(--safe-b));z-index:20;
    display:flex;flex-direction:column;gap:10px}
  .acts button{width:50px;height:50px;border-radius:50%;background:rgba(246,240,230,.12);
    color:var(--ink);font-size:19px;backdrop-filter:blur(8px);display:flex;
    align-items:center;justify-content:center}
  .acts button:active{background:rgba(232,180,92,.3)}
  .counter{position:fixed;left:0;right:0;bottom:calc(34px + var(--safe-b));text-align:center;
    color:var(--muted);font-size:12px;z-index:20;letter-spacing:.1em}
  .hidden{display:none}
</style>
</head>
<body>
<div class="feed" id="feed"></div>

<div class="acts hidden" id="acts">
  <button onclick="share()" aria-label="Compartilhar">↗</button>
  <button onclick="copy()" aria-label="Copiar">⧉</button>
  <button onclick="remix()" aria-label="Novas frases">✦</button>
</div>
<div class="counter hidden" id="counter"></div>
<a class="back" href="index.html">layouts ↑</a>

<script src="data/deck.js"></script>
<script src="data/img.js"></script>
<script src="data/engine.js"></script>
<script src="data/picker.js"></script>
<script>
const T=TAROT; let sel=[null,null], cards=[], at=0;
const feed=document.getElementById('feed');

function coverHTML(){
  const img=i=>sel[i]?`<img src="${T.imgThumb(sel[i])}" alt="">`:`<span class="ph">escolher<br>carta</span>`;
  return `<section class="screen cover">
    ${sel[0]&&sel[1]?`<div class="bg"><img src="${T.imgMini(sel[0])}" alt=""><img src="${T.imgMini(sel[1])}" alt=""></div><div class="veil"></div>`:''}
    <div class="pair">
      <button onclick="pick(0)">${img(0)}</button>
      <button onclick="pick(1)">${img(1)}</button>
    </div>
    <h1>${sel[0]&&sel[1]?T.cleanName(sel[0])+' → '+T.cleanName(sel[1]):'Tarô do Craque'}</h1>
    <p>${sel[0]&&sel[1]?'quinze faíscas, uma por tela':'escolha duas cartas — cada frase ganha uma tela inteira'}</p>
    <div class="go">
      <button class="ghost" onclick="pick(0)">Escolher</button>
      <button onclick="sortear()">🎲 Sortear</button>
    </div>
    ${sel[0]&&sel[1]?'<div class="swipe">deslize para cima ↑</div>':''}
  </section>`;
}
function render(keep){
  let html=coverHTML();
  if(sel[0]&&sel[1]){
    cards=T.flatSeeds(sel[0],sel[1]);
    html+=cards.map(s=>`<section class="screen">
      <div class="bg"><img src="${T.imgMini(sel[0])}" alt=""><img src="${T.imgMini(sel[1])}" alt=""></div>
      <div class="veil"></div>
      <div class="body">
        <span class="lens-tag" style="--ac:${s.lens.ac}">${s.lens.name}</span>
        <p class="phrase">${s.text}</p>
        <p class="from"><img src="${T.imgMini(sel[0])}" alt="">${T.cleanName(sel[0])} → ${T.cleanName(sel[1])}
          <img src="${T.imgMini(sel[1])}" alt=""></p>
      </div></section>`).join('');
  }
  feed.innerHTML=html;
  if(!keep) feed.scrollTop=0;
  document.getElementById('acts').classList.toggle('hidden',!(sel[0]&&sel[1]));
  update();
}
function update(){
  at=Math.round(feed.scrollTop/feed.clientHeight);
  const c=document.getElementById('counter');
  const show=sel[0]&&sel[1]&&at>0;
  c.classList.toggle('hidden',!show);
  if(show)c.textContent=at+' / '+cards.length;
}
feed.addEventListener('scroll',update,{passive:true});
function pick(i){Picker.open({title:i===0?'Carta de origem':'Carta de destino',selected:sel[i],
  onPick:n=>{sel[i]=n;render();}});}
function sortear(){sel=T.randomPair();T.buzz(12);render();}
function remix(){if(!cards.length)return;const p=feed.scrollTop;render(true);feed.scrollTop=p;T.buzz(8);}
function current(){const s=cards[at-1];return s?s.text.replace(/<[^>]+>/g,'')+
  '\n— '+T.cleanName(sel[0])+' → '+T.cleanName(sel[1]):'';}
function share(){const t=current();if(!t)return;
  if(navigator.share)navigator.share({text:t}).catch(()=>{});else copy();}
function copy(){const t=current();if(!t)return;
  navigator.clipboard&&navigator.clipboard.writeText(t);T.buzz(10);}
render();
</script>
</body>
</html>
